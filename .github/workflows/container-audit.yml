name: Container hardening audit

on:
  schedule:
    - cron: "27 3 * * 1"
  push:
    branches: [main]
    # Re-run the audit as soon as any of its inputs change instead of
    # waiting up to a week for the cron; image-digests merges arrive via
    # human pushes (bot merges dispatch this workflow explicitly).
    paths:
      - ".github/workflows/container-audit.yml"
      - ".trivyignore"
      - "docker/image-digests.json"
      - "docker/lynis-container.prf"
      - "scripts/container_hardening_report.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Pulls the pinned image from ghcr.io.
      packages: read
      # Uploads the Trivy SARIF scan to code scanning.
      security-events: write
      # Creates, edits, and closes the "Container hardening report" issue.
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and pull pinned image
        run: |
          set -euo pipefail
          ref=$(python3 - <<'PY'
          import json
          import re
          import sys

          data = json.load(open("docker/image-digests.json", encoding="utf-8"))
          if not isinstance(data, dict):
              sys.exit("image lock must be a JSON object")
          entry = data.get("dashboard_tools")
          if not isinstance(entry, dict):
              sys.exit("image lock must contain a dashboard_tools object")
          image = entry.get("image")
          digest = entry.get("digest")
          if image != "ghcr.io/vibebb/dashboard-tools":
              sys.exit("dashboard_tools image does not match ghcr.io/vibebb/dashboard-tools")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              sys.exit("dashboard_tools digest must be a sha256 digest")
          print(f"{image}@{digest}")
          PY
          )
          echo "PINNED_IMAGE=$ref" >> "$GITHUB_ENV"
          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          retry docker pull "$ref"
      - name: Restore Trivy DB cache (weekly key)
        id: trivy-cache
        run: |
          set -euo pipefail
          echo "key=cache-trivy-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: ${{ steps.trivy-cache.outputs.key }}
          restore-keys: cache-trivy-
      - name: Scan pinned image (Trivy SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Shared cache so the three Trivy scans reuse one DB download.
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        with:
          scan-type: image
          # The digest is frozen; the vulnerability DB is not — this scan
          # surfaces newly disclosed CVEs against the shipped tools image.
          scan-ref: ${{ env.PINNED_IMAGE }}
          version: v0.75.0
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
      - name: Scan pinned image (Trivy JSON, full)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        with:
          scan-type: image
          scan-ref: ${{ env.PINNED_IMAGE }}
          version: v0.75.0
          scanners: vuln,secret,misconfig,license
          exit-code: '0'
          format: json
          output: trivy-image.json
          skip-setup-trivy: true
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-dashboard-tools-audit
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - name: Run Docker CIS compliance report
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          # The compliance report exits 0 even when it produced an empty
          # payload, so retry once keyed on content, not the exit code.
          for attempt in 1 2; do
            trivy image --compliance docker-cis-1.6.0 --report all \
              --ignorefile /dev/null --format json \
              --output "$RUNNER_TEMP/trivy-cis.json" "${PINNED_IMAGE}"
            if python3 scripts/container_hardening_report.py \
              --check-cis "$RUNNER_TEMP/trivy-cis.json"; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Docker CIS scan produced no results after retry" >&2
              exit 1
            fi
            echo "Docker CIS scan returned an empty payload; retrying once" >&2
          done
      - name: Run informational Lynis audit inside the image
        id: lynis
        continue-on-error: true
        env:
          LYNIS_OUT: ${{ runner.temp }}/lynis-out
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.1.7 \
            https://github.com/CISOfy/lynis "$RUNNER_TEMP/lynis"
          # The mutable 3.1.7 tag must resolve to this commit; a moved tag
          # fails the checkout instead of silently auditing different code.
          git -C "$RUNNER_TEMP/lynis" checkout --detach \
            2e99f92265760b73fd6b139868eb8d4116624030
          mkdir -p "$LYNIS_OUT"
          docker run --rm --user 0 \
            -v "$RUNNER_TEMP/lynis:/lynis:ro" \
            -v "$GITHUB_WORKSPACE/docker/lynis-container.prf:/container.prf:ro" \
            -v "$LYNIS_OUT:/out" \
            --entrypoint /bin/sh "$PINNED_IMAGE" \
            -c 'cd /lynis && ./lynis audit system --quick --no-colors \
                --profile /container.prf \
                --report-file /out/lynis-report.dat --logfile /out/lynis.log \
                --auditor github-actions; \
                # Lynis writes its outputs with umask 027 (0640 root-owned):
                # loosen them so the runner-side grep below can read them.
                chmod 644 /out/lynis-report.dat /out/lynis.log 2>/dev/null' || true
          index=$(grep '^hardening_index=' "$LYNIS_OUT/lynis-report.dat" \
            | head -1 | cut -d= -f2 || true)
          warnings=$(grep -c '^warning\[\]' "$LYNIS_OUT/lynis-report.dat" || true)
          printf 'hardening_index=%s\nwarnings=%s\n' \
            "${index:-unknown}" "${warnings:-0}" >> "$GITHUB_OUTPUT"
      - name: Compute container-hardening report
        env:
          LYNIS_OUT: ${{ runner.temp }}/lynis-out
          TRIVY_JSON: trivy-image.json
          TRIVY_CIS: ${{ runner.temp }}/trivy-cis.json
          REPORT_JSON: container-hardening.json
        run: |
          set -euo pipefail
          python3 scripts/container_hardening_report.py \
            --trivy-json "$TRIVY_JSON" \
            --cis-json "$TRIVY_CIS" \
            --lynis-report "$LYNIS_OUT/lynis-report.dat" \
            --image-ref "$PINNED_IMAGE" \
            --out "$REPORT_JSON"
      - name: Upload hardening report
        if: always() && hashFiles('container-hardening.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-tools-hardening-audit
          path: |
            container-hardening.json
            trivy-image.json
          # Diagnostic artifacts lose value once the issue is triaged;
          # the attested SBOM stays at 90 days for compliance.
          retention-days: 30
      - name: Post report to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_JSON: container-hardening.json
          REPORT_MD: ${{ runner.temp }}/hardening-report.md
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$REPORT_MD"
          import json, os
          r = json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))
          t = r["trivy"]
          print(f"# Container hardening report\n")
          print(f"Image: `{r['image']}`\nDigest: `{r['digest']}`\n")
          print("| Metric | Value |")
          print("|---|---|")
          print(f"| Trivy vulns C/H/M/L | {t['critical']}/{t['high']}/{t['medium']}/{t['low']} |")
          print(f"| Fixable HIGH+CRITICAL | {t['fixable_high_or_critical']} |")
          print(f"| Misconfig pass | {t['misconfig_pass']}/{t['misconfig_total']} |")
          print(f"| Secrets found | {t['secrets']} |")
          cis = r["cis_docker"]
          cis_note = ""
          if cis.get("accepted_policy_failures"):
              accepted = ", ".join(cis["accepted_policy_failures"])
              cis_note += f" ({len(cis['accepted_policy_failures'])} accepted policy deferrals: {accepted})"
          if cis.get("unexpected_failure_ids"):
              unexpected = ", ".join(cis["unexpected_failure_ids"])
              cis_note += f" — unexpected failures: {unexpected}"
          print(f"| CIS Docker pass/fail | {cis['passed']}/{cis['failed']}{cis_note} |")
          print(f"| Lynis hardening index (trend only) | {r['lynis']['hardening_index']} |")
          print(f"| Lynis warnings | {r['lynis']['warnings']} |")
          print(f"\nRun: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          PY
          gh label create container-hardening --repo "$GITHUB_REPOSITORY" \
            --color d93f0b --description "Container hardening report" --force
          cat "$REPORT_MD" >> "$GITHUB_STEP_SUMMARY"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label container-hardening \
            --search "in:title Container hardening report" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_MD"
          else
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Container hardening report" \
              --label container-hardening --body-file "$REPORT_MD" | sed 's#.*/##')
          fi
          gate=$(python3 -c 'import json, os; print(json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))["gate"]["fixable_high_or_critical"])')
          if [ "$gate" = "0" ] && [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "No fixable HIGH/CRITICAL findings remain."
          fi
