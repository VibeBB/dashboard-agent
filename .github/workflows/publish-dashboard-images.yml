name: Publish dashboard images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - "src/**"
      - "plugins/dashboard/**"
      - "runtime/**"
      - "examples/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish-dashboard-images.yml"
      - "scripts/publish_image_pin_pr.sh"
      - "scripts/package_level_sbom.py"
      - "!docker/image-digests.json"
      - "!plugins/dashboard/tools-image.json"
      - "!docker/README.md"
  # Manual dispatch builds the image only by default — publishing a
  # registry artifact stays tied to a reviewed push to main. dry_run=true
  # rehearses the full gate path (Trivy scans, SBOM chain, tool measurement,
  # launcher smoke) against the locally loaded image while push, :latest
  # promotion, attestations, code-scanning SARIF, and the digest-lock PR
  # stay skipped.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse the gate chain without publishing or locking
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-dashboard-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: write
      id-token: write # OIDC for build-provenance attestation
      attestations: write # stores the attestation
      artifact-metadata: write # creates the attestation storage record
      security-events: write # uploads the Trivy SARIF scan to code scanning
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: publish-dashboard
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Restore Trivy DB cache (weekly key)
        id: trivy-cache
        run: |
          set -euo pipefail
          echo "key=cache-trivy-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Restore-only: a publishing workflow must not write cache entries
          # (zizmor cache-poisoning); the weekly container-audit run owns the
          # save for this shared weekly key.
          lookup-only: true
          path: ${{ runner.temp }}/trivy-cache
          key: ${{ steps.trivy-cache.outputs.key }}
          restore-keys: cache-trivy-
      - name: Build and publish dashboard tools
        id: tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/dashboard-tools.Dockerfile
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          # Only a reviewed push to main may publish; manual dispatch runs a
          # build-only rehearsal of the Dockerfile. dry_run additionally loads
          # the image into the local daemon (single-platform build) so the
          # gate chain can run against it.
          push: ${{ github.event_name == 'push' }}
          load: ${{ inputs.dry_run == true }}
          # Push only the immutable tag; :latest is promoted after the Trivy
          # gate so a vulnerable digest never serves :latest.
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/dashboard-tools:${{ github.sha }}-tools
          cache-from: type=gha,scope=dashboard-tools
          cache-to: type=gha,mode=max,scope=dashboard-tools,ignore-error=true
      - name: Resolve scan image reference
        id: scan-ref
        env:
          IMAGE_OWNER: ${{ steps.owner.outputs.name }}
          BUILT_DIGEST: ${{ steps.tools.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Push runs scan the exact pushed digest — the content the SBOM and
          # provenance attestations bind to. A dry_run build only loads into
          # the local daemon, so retag it under a slash-free local name the
          # measurement probes also accept.
          if [ "$DRY_RUN" = "true" ]; then
            docker tag \
              "ghcr.io/${IMAGE_OWNER}/dashboard-tools:${GITHUB_SHA}-tools" \
              "dashboard-tools:${GITHUB_SHA}-rehearsal"
            echo "ref=dashboard-tools:${GITHUB_SHA}-rehearsal" >> "$GITHUB_OUTPUT"
          else
            echo "ref=ghcr.io/${IMAGE_OWNER}/dashboard-tools@${BUILT_DIGEST}" >> "$GITHUB_OUTPUT"
          fi
      # Attestation only needs the pushed digest: run it as a background
      # step overlapping every post-build leg and join it before the
      # digest-lock update that reads its attestation-url output.
      - name: Attest dashboard tools image provenance
        id: attest
        if: github.event_name == 'push' && inputs.dry_run != true
        background: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/dashboard-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          push-to-registry: true
      # Independent post-build legs run as a parallel group; the implicit
      # wait at the group end still lands the full JSON scan before the
      # SARIF gate, so the diagnostic report exists even when the gate
      # fails — exactly when it is needed.
      - parallel:
          - name: Scan tools image (Trivy JSON)
            # The SARIF gate follows this group so the JSON report exists
            # even when the gate fails the run. On dry_run dispatch it
            # scans the locally loaded rehearsal tag; plain dispatch
            # builds nothing to scan.
            if: github.event_name == 'push' || inputs.dry_run == true
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
              scan-type: image
              scan-ref: ${{ steps.scan-ref.outputs.ref }}
              # Private cache dir: this leg runs inside a parallel group,
              # and trivy-action's default cache-dir (.cache/trivy) would
              # share the DB with other legs and corrupt db/metadata.json
              # on concurrent writes.
              cache-dir: ${{ runner.temp }}/trivy-tools-json
              version: v0.75.0
              scanners: vuln,secret,misconfig,license
              ignore-unfixed: false
              exit-code: '0'
              format: json
              output: trivy-image.json
          - name: Generate tools SPDX SBOM
            if: github.event_name == 'push' || inputs.dry_run == true
            uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
            env:
              # Registry pulls on publish; a dry_run image exists only in
              # the local docker daemon.
              SYFT_SOURCE_IMAGE_DEFAULT_PULL_SOURCE: ${{ inputs.dry_run == true && 'docker' || 'registry' }}
              TMPDIR: ${{ runner.temp }}
              SYFT_FILE_METADATA_SELECTION: none
            with:
              image: ${{ steps.scan-ref.outputs.ref }}
              format: spdx-json
              output-file: ${{ runner.temp }}/dashboard-tools.full.spdx.json
              upload-artifact: false
              upload-release-assets: false
          - name: Measure published tools
            if: github.event_name == 'push' || inputs.dry_run == true
            env:
              IMAGE_REF: ${{ steps.scan-ref.outputs.ref }}
            run: uv run python scripts/measure_image_tools.py --image-ref "$IMAGE_REF" --out "$RUNNER_TEMP/dashboard-tools.json"
      - name: Scan tools image (Trivy SARIF)
        id: trivy-scan
        if: github.event_name == 'push' || inputs.dry_run == true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # Scan the exact pushed digest on publish — the content the SBOM
          # and provenance attestations bind to (the rehearsal tag in dry_run).
          scan-ref: ${{ steps.scan-ref.outputs.ref }}
          # Shared warm DB dir; sequential legs may share it. Never place
          # trivy-action legs inside a `parallel:` group with a shared
          # cache-dir — concurrent writers corrupt the DB, and the action
          # also round-trips env vars through ./trivy_envs.txt in the job
          # cwd, which races the same way. TRIVY_CACHE_DIR env does NOT
          # override the action's cache-dir input.
          cache-dir: ${{ runner.temp }}/trivy-cache
          version: v0.75.0
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
      - name: Summarize Trivy gate findings
        # The JSON scan ran before the gate, so the fixable HIGH/CRITICAL
        # findings behind the failure can be listed in the run summary.
        if: failure() && hashFiles('trivy-image.json') != ''
        run: python3 scripts/trivy_gate_summary.py trivy-image.json >> "$GITHUB_STEP_SUMMARY"
      - name: Promote :latest
        if: github.event_name == 'push' && inputs.dry_run != true
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/dashboard-tools
          DIGEST: ${{ steps.tools.outputs.digest }}
        run: |
          # The digest passed the fixable-CVE gate; only now may the mutable
          # tag move. `imagetools create` copies the manifest server-side, so
          # attestations keep referencing the digest.
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${DIGEST}"
      - name: Upload Trivy SARIF
        # A rehearsal must not file code-scanning alerts; upload stays push-only.
        if: always() && github.event_name == 'push' && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-dashboard-tools
      - name: Upload Trivy JSON report
        if: always() && hashFiles('trivy-image.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-tools-trivy
          path: trivy-image.json
          retention-days: 30
      - id: image
        env:
          IMAGE_OWNER: ${{ steps.owner.outputs.name }}
          BUILT_DIGEST: ${{ steps.tools.outputs.digest }}
        run: |
          set -euo pipefail
          case "$BUILT_DIGEST" in sha256:*) ;; *) echo "invalid image digest: $BUILT_DIGEST" >&2; exit 1 ;; esac
          {
            echo "ref=ghcr.io/${IMAGE_OWNER}/dashboard-tools@${BUILT_DIGEST}"
            echo "tag=${GITHUB_SHA}-tools"
            echo "digest=${BUILT_DIGEST}"
          } >> "$GITHUB_OUTPUT"
      - name: Package tools SPDX SBOM
        if: github.event_name == 'push' || inputs.dry_run == true
        run: |
          python3 scripts/package_level_sbom.py \
            "$RUNNER_TEMP/dashboard-tools.full.spdx.json" \
            "$RUNNER_TEMP/dashboard-tools.spdx.json"
      - name: Guard tools SPDX SBOM size
        if: github.event_name == 'push' || inputs.dry_run == true
        env:
          SBOM_PATH: ${{ runner.temp }}/dashboard-tools.spdx.json
        run: |
          set -euo pipefail
          df -h /tmp "$RUNNER_TEMP"
          size=$(stat -c%s "$SBOM_PATH")
          echo "SBOM size: ${size} bytes"
          if [ "$size" -gt 16777216 ]; then
            echo "::error::SBOM exceeds 16777216 bytes: ${size} bytes"
            exit 1
          fi

      - name: Validate tools SPDX SBOM
        if: github.event_name == 'push' || inputs.dry_run == true
        run: |
          python3 - "${{ runner.temp }}/dashboard-tools.spdx.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sbom = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("tools SBOM must use SPDX-2.3")
          PY
      # Overlaps the smoke run below; joined before the digest-lock update.
      - name: Attest tools SBOM
        id: attest_sbom
        if: github.event_name == 'push' && inputs.dry_run != true
        background: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/dashboard-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          sbom-path: ${{ runner.temp }}/dashboard-tools.spdx.json
          push-to-registry: true
      - name: Upload full tools SPDX SBOM
        if: github.event_name == 'push' || inputs.dry_run == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-tools-spdx-sbom
          path: ${{ runner.temp }}/dashboard-tools.full.spdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Smoke published tools through the launcher
        if: github.event_name == 'push' || inputs.dry_run == true
        env:
          DASHBOARD_TOOLS_IMAGE: ${{ steps.scan-ref.outputs.ref }}
          DASHBOARD_SRC: ${{ github.workspace }}/src
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          launcher=plugins/dashboard/scripts/dashboard_launcher.py
          python3 "$launcher" doctor > "$RUNNER_TEMP/dashboard-doctor.json"
          for contract in examples/smart-kettle/smart-kettle.dash.json examples/bench-meter/bench-meter.dash.json; do
            design=$(basename "$contract" .dash.json)
            out="examples/$design/out"
            mkdir -p "$out"
            python3 "$launcher" generate "$contract"
            set +e
            python3 "$launcher" gates "$contract" > "$out/$design.stdout.json"
            status=$?
            set -e
            report="$out/$design.dash-report.json"
            stdout="$out/$design.stdout.json"
            if python3 - "$report" "$stdout" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report_path, stdout_path = map(Path, sys.argv[1:])
          if report_path.is_file():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              lines = [
                  f"{check['id']:26} {check['status']:16} {check['detail'][:180]}"
                  for check in report["checks"]
              ]
              print("\n".join(lines))
              verdict = report["verdict"]
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path and lines:
                  design = report_path.name.removesuffix(".dash-report.json")
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write(
                          f"### {design} gates — verdict: {verdict}\n\n```\n"
                          + "\n".join(lines)
                          + "\n```\n"
                      )
          elif stdout_path.is_file():
              output = stdout_path.read_text(encoding="utf-8")
              print(output, end="")
              verdict = json.loads(output)["verdict"]
          else:
              print(f"missing diagnostics: {report_path} and {stdout_path}", file=sys.stderr)
              sys.exit(1)
          sys.exit(0 if verdict == "pass" else 1)
          PY
            then
              diagnostics_status=0
            else
              diagnostics_status=$?
            fi
            if [ "$status" -ne 0 ] || [ "$diagnostics_status" -ne 0 ]; then
              echo "$design gates failed (exit=$status, diagnostics=$diagnostics_status)" >&2
              exit 1
            fi
          done
      - name: Upload smoke reports
        if: always() && hashFiles('examples/*/out/*.dash-report.json', 'examples/*/out/*.stdout.json', 'examples/*/out/*.servo-smoke.log', 'examples/*/out/*.screens/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-publish-smoke-reports
          path: |
            examples/*/out/*.dash-report.json
            examples/*/out/*.stdout.json
            examples/*/out/*.servo-smoke.log
            examples/*/out/*.screens/**
          retention-days: 30
          if-no-files-found: warn
      - name: Record published image summary
        if: github.event_name == 'push'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "## dashboard tools image"
            echo
            echo "- **image**: \`$IMAGE_REF\`"
            echo "- **digest**: \`$IMAGE_DIGEST\`"
            echo "- **tag**: \`$IMAGE_TAG\`"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for attestations
        wait: [attest, attest_sbom]
      - name: Update digest lock and merge PR
        if: github.event_name == 'push' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_OWNER: ${{ steps.owner.outputs.name }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.attest_sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git fetch -q origin main
          base_sha=$(git rev-parse origin/main)
          branch="bot/update-image-digests-${IMAGE_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -q -c "$branch" "$base_sha"
          uv run python scripts/update_image_digest_lock.py \
            --lock docker/image-digests.json \
            --entry dashboard_tools \
            --image "ghcr.io/${IMAGE_OWNER}/dashboard-tools" \
            --tag "$IMAGE_TAG" \
            --digest "$IMAGE_DIGEST" \
            --published-at "$published_at" \
            --workflow-run "$workflow_run" \
            --dockerfile docker/dashboard-tools.Dockerfile \
            --attestation "$ATTESTATION_URL" \
            --sbom-attestation "$SBOM_ATTESTATION_URL" \
            --tools-json "$RUNNER_TEMP/dashboard-tools.json"
          python3 - <<'PY'
          import json
          from pathlib import Path

          entry = json.loads(Path("docker/image-digests.json").read_text(encoding="utf-8"))["dashboard_tools"]
          Path("plugins/dashboard/tools-image.json").write_text(
              json.dumps(entry, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          if [ -z "$(git status --porcelain -- docker/image-digests.json plugins/dashboard/tools-image.json)" ]; then
            echo "Image digest lock is unchanged; no pull request is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/image-digests.json plugins/dashboard/tools-image.json
          git commit -m "Update dashboard image digest lock"
          retry git push --set-upstream origin "$branch"
          body=$(printf '%s\n\n- tools: %s\n- workflow run: %s\n' \
            "The publish workflow updated the dashboard tools image digest lock." \
            "$IMAGE_REF" "$workflow_run")
          for old_pr in $(retry gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("bot/update-image-digests-")) | .number' || true); do
            retry gh pr close "$old_pr" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by ${workflow_run}" --delete-branch || true
          done
          pr_url=$(retry gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Update dashboard image digest lock" --body "$body")
          echo "pin PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/publish_image_pin_pr.sh "$pr_url" "$branch" "" "ci.yml locked-image-check.yml container-audit.yml"
      - name: Dry-run rehearsal summary
        if: always() && inputs.dry_run == true
        run: |
          {
            echo "## Publish dry-run rehearsal"
            echo
            echo "Built the tools image and ran the gate chain (Trivy scans,"
            echo "SBOM generation/packaging/guard, tool measurement, launcher"
            echo "smoke) against the local rehearsal tag. Skipped irreversible"
            echo "steps:"
            echo
            echo "- push of the immutable tag and :latest promotion"
            echo "- build-provenance and SBOM attestations"
            echo "- Trivy SARIF upload to code scanning"
            echo "- digest-lock PR and post-merge workflow dispatches"
          } >> "$GITHUB_STEP_SUMMARY"
