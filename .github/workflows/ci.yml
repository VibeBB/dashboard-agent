name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.21
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest
      - name: Plugin load (OpenHands SDK)
        env:
          OPENHANDS_SUPPRESS_BANNER: "1"
        run: uv run --group sdk-check python scripts/check_plugin_load.py
      - name: Docs
        run: uv run python scripts/verify_docs.py

  runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Runtime typecheck and tests
        working-directory: runtime
        run: npm ci && npx tsc -p . && node --test test/

  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build dashboard-tools image (retry Docker Hub 429s)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            docker buildx build --load \
              -f docker/dashboard-tools.Dockerfile \
              -t dashboard-tools:ci \
              --build-arg IMAGE_REVISION=${{ github.sha }} \
              --cache-from type=gha,scope=dashboard-tools \
              --cache-to type=gha,mode=max,scope=dashboard-tools . 2>&1 | tee docker-build.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eqi '429 Too Many Requests|toomanyrequests' docker-build.log; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Docker Hub throttling persisted after three build attempts." >&2
              exit "$status"
            fi
            sleep $((attempt * 30))
          done
      - name: Full gates in the image (no network)
        shell: bash
        env:
          DASHBOARD_TOOLS_IMAGE: dashboard-tools:ci
          DASHBOARD_SRC: ${{ github.workspace }}/src
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          launcher=plugins/dashboard/scripts/dashboard_launcher.py
          python3 "$launcher" doctor > doctor.json
          for contract in examples/smart-kettle/smart-kettle.dash.json examples/bench-meter/bench-meter.dash.json; do
            design=$(basename "$contract" .dash.json)
            out="examples/$design/out"
            mkdir -p "$out"
            python3 "$launcher" gates "$contract" > "$out/$design.stdout.json"
            python3 - "$out/$design.dash-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          for check in report["checks"]:
              print(f"{check['id']:26} {check['status']:16} {check['detail'][:180]}")
          sys.exit(0 if report["verdict"] == "pass" else 1)
          PY
          done
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-reports
          path: |
            examples/*/out/*.dash-report.*
            examples/*/out/*.stdout.json
            doctor.json
            docker-build.log
          if-no-files-found: warn
