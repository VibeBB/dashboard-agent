name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          if grep -Ev '^(docs/|[^/]+\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$)' "$RUNNER_TEMP/changed-files" >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Forward-compatibility canary ahead of the 2026-10-09 stable
          # release: step-level continue-on-error keeps the leg green while
          # the last step reports the failure as an annotation.
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        continue-on-error: ${{ matrix.experimental || false }}
        with:
          version: 0.12.23
          python-version: ${{ matrix.python-version }}
          cache-suffix: python-${{ matrix.python-version }}
      - name: Sync dependencies
        id: sync-dependencies
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv sync --locked
      - name: Ruff
        id: ruff
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pyright
        id: pyright
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run pyright
      - name: Pytest
        id: pytest
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - name: Shared hooks
        id: shared-hooks
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run python scripts/check_shared_hooks.py
      - name: Check shared workflows
        id: check-shared-workflows
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run python scripts/check_shared_workflows.py
      - name: Plugin load (OpenHands SDK)
        id: plugin-load-openhands-sdk
        continue-on-error: ${{ matrix.experimental || false }}
        env:
          OPENHANDS_SUPPRESS_BANNER: "1"
        run: uv run --group sdk-check python scripts/check_plugin_load.py
      - name: Docs
        id: docs
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run python scripts/verify_docs.py

      - name: Report 3.15 canary outcome
        if: matrix.experimental && (steps.setup-uv.outcome == 'failure' || steps.sync-dependencies.outcome == 'failure' || steps.ruff.outcome == 'failure' || steps.pyright.outcome == 'failure' || steps.pytest.outcome == 'failure' || steps.shared-hooks.outcome == 'failure' || steps.check-shared-workflows.outcome == 'failure' || steps.plugin-load-openhands-sdk.outcome == 'failure' || steps.docs.outcome == 'failure')
        run: |
          echo "::warning::Python 3.15 canary leg failed — forward-compat signal, not a gate failure"
  runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Runtime typecheck and tests
        working-directory: runtime
        run: npm ci && npx tsc -p . && node --test test/

  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/dashboard-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/dashboard-tools.Dockerfile .

  e2e-examples:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      contracts: ${{ steps.list.outputs.contracts }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # Every examples/<name>/<name>.dash.json becomes one matrix leg, so new
      # examples parallelize automatically.
      - id: list
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob
          import json
          import re

          contracts = []
          for path in sorted(glob.glob("examples/*/*.dash.json")):
              name = path.split("/")[1]
              if re.fullmatch(r"[a-z0-9][a-z0-9-]*", name) is None:
                  raise SystemExit(f"unexpected example dir name: {name}")
              contracts.append({"name": name, "contract": path})
          if not contracts:
              raise SystemExit("no example contracts found under examples/")
          print("contracts=" + json.dumps(contracts))
          PY

  e2e-example:
    name: e2e (${{ matrix.name }})
    needs: [changes, e2e-examples]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Writes the shared registry buildcache on push/dispatch runs; fork-PR
      # tokens are clamped to read-only regardless.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-examples.outputs.contracts) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The GHCR buildcache survives the gha cache's eviction window and is
      # readable by pull_request runs, where most cold builds happened. The
      # login is skipped for fork PRs (their token cannot read packages), so
      # those runs keep the original gha-only behavior.
      - name: Log in to GHCR for the registry build cache
        id: ghcr-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build dashboard-tools image (retry Docker Hub 429s)
        shell: bash
        env:
          IMAGE_REVISION: ${{ inputs.ref || github.sha }}
          GHCR: ${{ steps.ghcr-login.outcome == 'success' }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cache_from=(--cache-from "type=gha,scope=dashboard-tools")
          cache_to=(--cache-to "type=gha,mode=max,scope=dashboard-tools")
          if [ "$GHCR" = "true" ]; then
            cache_from+=(--cache-from "type=registry,ref=ghcr.io/$owner/dashboard-tools-buildcache:main")
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              cache_to=(--cache-to "type=registry,ref=ghcr.io/$owner/dashboard-tools-buildcache:main,mode=max")
            fi
          fi
          for attempt in 1 2 3; do
            set +e
            docker buildx build --load \
              -f docker/dashboard-tools.Dockerfile \
              -t dashboard-tools:ci \
              --build-arg "IMAGE_REVISION=$IMAGE_REVISION" \
              "${cache_from[@]}" "${cache_to[@]}" . 2>&1 | tee docker-build.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eqi '429 Too Many Requests|toomanyrequests' docker-build.log; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Docker Hub throttling persisted after three build attempts." >&2
              exit "$status"
            fi
            sleep $((attempt * 30))
          done
      - name: Full gates in the image (internal Docker network, no Internet egress)
        shell: bash
        env:
          DASHBOARD_TOOLS_IMAGE: dashboard-tools:ci
          DASHBOARD_SRC: ${{ github.workspace }}/src
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
          CONTRACT: ${{ matrix.contract }}
        run: |
          set -euo pipefail
          launcher=plugins/dashboard/scripts/dashboard_launcher.py
          doctor_status=0
          if python3 "$launcher" doctor > doctor.json; then
            :
          else
            doctor_status=$?
          fi
          python3 -m json.tool doctor.json
          if [ "$doctor_status" -ne 0 ]; then
            echo "Dashboard doctor failed (exit=$doctor_status)" >&2
            exit "$doctor_status"
          fi
          contract="$CONTRACT"
          design=$(basename "$contract" .dash.json)
          out="examples/$design/out"
          mkdir -p "$out"
          python3 "$launcher" generate "$contract"
          gate_status=0
          if python3 "$launcher" gates "$contract" > "$out/$design.stdout.json"; then
            :
          else
            gate_status=$?
          fi
          report_status=0
          if [ -s "$out/$design.dash-report.json" ]; then
            if python3 - "$out/$design.dash-report.json" "$design" <<'PY'
          import json, os, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as report_file:
                  report = json.load(report_file)
              lines = []
              for check in report["checks"]:
                  detail = check["detail"]
                  if check["id"] != "smoke.servo":
                      detail = detail[:180]
                  line = f"{check['id']:26} {check['status']:16} {detail}"
                  lines.append(line)
                  print(line)
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path and lines:
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write(
                          f"### {sys.argv[2]} gates — verdict: {report['verdict']}\n\n```\n"
                          + "\n".join(lines)
                          + "\n```\n"
                      )
              sys.exit(0 if report["verdict"] == "pass" else 1)
          except (KeyError, OSError, TypeError, ValueError) as exc:
              print(f"Dashboard gate report unavailable: {exc}")
              sys.exit(1)
          PY
            then
              :
            else
              report_status=$?
            fi
          else
            echo "Dashboard gate report unavailable: $out/$design.dash-report.json" >&2
            report_status=1
          fi
          if [ "$gate_status" -ne 0 ]; then
            exit "$gate_status"
          fi
          if [ "$report_status" -ne 0 ]; then
            exit "$report_status"
          fi
      - name: Upload reports
        if: always() && hashFiles('examples/*/out/*.dash-report.json', 'examples/*/out/*.stdout.json', 'examples/*/out/*.servo-smoke.log', 'examples/*/out/*.screens/**', 'doctor.json', 'docker-build.log') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-reports-${{ matrix.name }}
          path: |
            examples/*/out/*.dash-report.json
            examples/*/out/*.stdout.json
            examples/*/out/*.servo-smoke.log
            examples/*/out/*.screens/**
            doctor.json
            docker-build.log
          retention-days: 30
          if-no-files-found: warn

  e2e:
    needs: [changes, e2e-examples, e2e-example]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Aggregate e2e results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          legs = ("e2e-examples", "e2e-example")
          results = {name: needs[name]["result"] for name in legs}
          # Out of scope the legs are skipped by design; in scope every leg
          # must succeed so a skipped-leg-needs-failure cannot masquerade.
          expected = "success" if needs["changes"]["outputs"].get("code") == "true" else "skipped"
          bad = {k: v for k, v in results.items() if v != expected}
          for name in legs:
              print(f"{name}: {results[name]}")
          if bad:
              print(f"::error::e2e legs not {expected}: {bad}")
              sys.exit(1)
          PY
