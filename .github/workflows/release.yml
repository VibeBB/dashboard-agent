name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump kind
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: Explicit X.Y.Z override
        required: false
        type: string
      dry_run:
        description: Rehearse the bump and checks without merging or tagging
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-26.04
    # The job gh-watches a dispatched ci.yml whose e2e alone allows ~90min.
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = "refs/heads/main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Bump version files
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          SET_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        # The release state machine lives in scripts/release_bump.sh so the
        # dry_run rehearsal path is exercisable under pytest (stubbed gh,
        # local git remotes — see tests/test_release_bump.py).
        run: bash scripts/release_bump.sh

  install-smoke:
    needs: bump-version
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"
          cache-suffix: release-install-smoke
      - name: Sync dependencies
        run: uv sync --locked --group sdk-check
      - name: Smoke-test remote install
        env:
          REF: ${{ needs.bump-version.outputs.sha }}
        run: >
          uv run --group sdk-check python scripts/smoke_install_plugin.py
          --repo VibeBB/dashboard-agent --ref "$REF" --repo-path plugins/dashboard

  release:
    needs: [bump-version, install-smoke]
    if: inputs.dry_run != true
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.bump-version.outputs.version }}
      SHA: ${{ needs.bump-version.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false
      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd plugins && zip -r "$GITHUB_WORKSPACE/dist/dashboard-plugin-v${VERSION}.zip" dashboard)
          zip -r "dist/dashboard-examples-v${VERSION}.zip" examples
      - name: Create release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" --target "$SHA" \
            --title "dashboard-agent v${VERSION}" --generate-notes dist/*.zip
