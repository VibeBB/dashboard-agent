name: Locked image check

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: locked-image-check
  cancel-in-progress: false

jobs:
  check-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      present: ${{ steps.lock.outputs.present }}
      image: ${{ steps.lock.outputs.image }}
      digest: ${{ steps.lock.outputs.digest }}
      attestation: ${{ steps.lock.outputs.attestation }}
      sbom_attestation: ${{ steps.sbom.outputs.sbom_attestation }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          lock_path = Path("docker/image-digests.json")
          present = "false"
          image = ""
          digest = ""
          attestation = ""
          if lock_path.exists():
              lock = json.loads(lock_path.read_text(encoding="utf-8"))
              if not isinstance(lock, dict):
                  raise SystemExit("image lock must be a JSON object")
              entry = lock.get("dashboard_tools")
              if not isinstance(entry, dict):
                  raise SystemExit("image lock must contain a dashboard_tools object")
              if entry.get("image") != "ghcr.io/vibebb/dashboard-tools":
                  raise SystemExit(
                      "dashboard_tools image does not match ghcr.io/vibebb/dashboard-tools"
                  )
              if "digest" not in entry or "tag" not in entry:
                  raise SystemExit("dashboard_tools lock must contain digest and tag fields")
              digest = entry["digest"]
              tag = entry["tag"]
              if digest is None and tag is None:
                  if entry.get("attestation") is not None:
                      raise SystemExit(
                          "dashboard_tools attestation cannot exist without a pinned image"
                      )
              else:
                  if (
                      not isinstance(digest, str)
                      or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
                      or digest == f"sha256:{'0' * 64}"
                  ):
                      raise SystemExit(
                          "dashboard_tools digest must be null or a sha256 digest"
                      )
                  if (
                      not isinstance(tag, str)
                      or re.fullmatch(r"[0-9a-f]{40}-tools", tag) is None
                  ):
                      raise SystemExit(
                          "dashboard_tools tag must be null or a 40-character tools tag"
                      )
                  present = "true"
                  image = entry["image"]
                  attestation_value = entry.get("attestation")
                  if attestation_value is not None:
                      parsed = (
                          urlsplit(attestation_value)
                          if isinstance(attestation_value, str)
                          else None
                      )
                      if (
                          parsed is None
                          or parsed.scheme != "https"
                          or not parsed.netloc
                          or any(character.isspace() for character in attestation_value)
                      ):
                          raise SystemExit(
                              "dashboard_tools attestation must be an HTTPS URL"
                          )
                      attestation = attestation_value
              digest = digest if present == "true" else ""
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"present={present}\n")
              output.write(f"image={image}\n")
              output.write(f"digest={digest}\n")
              output.write(f"attestation={attestation}\n")
          PY
      - id: sbom
        env:
          LOCK_PATH: docker/image-digests.json
          LOCK_ENTRY: dashboard_tools
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          path = Path(os.environ["LOCK_PATH"])
          entry = None
          if path.is_file():
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit("image digest lock must be a JSON object")
              entry = data.get(os.environ["LOCK_ENTRY"])
          if entry is not None and not isinstance(entry, dict):
              raise SystemExit("image lock entry must be an object")
          sbom_attestation = entry.get("sbom_attestation") if entry else None
          if entry and entry.get("digest") is None and entry.get("tag") is None:
              if sbom_attestation is not None:
                  raise SystemExit("unpublished image entry cannot have an SBOM attestation")
              sbom_attestation = ""
          elif sbom_attestation is not None:
              parsed = urlsplit(sbom_attestation) if isinstance(sbom_attestation, str) else None
              if (
                  parsed is None
                  or parsed.scheme != "https"
                  or not parsed.netloc
                  or any(character.isspace() for character in sbom_attestation)
              ):
                  raise SystemExit("image lock SBOM attestation must be an HTTPS URL")
          print(f"sbom_attestation={sbom_attestation or ''}")
          PY
  check:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-suffix: locked-dashboard-image
      - run: uv sync --locked
      - name: Warn that tools image has no attestation metadata
        if: needs.check-lock.outputs.attestation == ''
        run: echo "::warning::dashboard_tools image lock has no attestation metadata; skipping provenance verification."
      - name: Verify tools image provenance
        if: needs.check-lock.outputs.attestation != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.check-lock.outputs.image }}
          DIGEST: ${{ needs.check-lock.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-dashboard-images.yml"
          echo "- image provenance attestation: verified \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Warn when tools image has no SBOM attestation
        if: needs.check-lock.outputs.sbom_attestation == ''
        run: echo "::warning::dashboard_tools image lock has no SBOM attestation; continuing"
      - name: Verify tools image SBOM attestation
        if: needs.check-lock.outputs.sbom_attestation != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.check-lock.outputs.image }}
          DIGEST: ${{ needs.check-lock.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-dashboard-images.yml" \
            --predicate-type https://spdx.dev/Document/v2.3
          echo "- image SBOM attestation: verified \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Pull locked dashboard image
        run: uv run python scripts/pull_locked_image.py --entry dashboard_tools
      - name: Full gates through launcher
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARD_SRC: ${{ github.workspace }}/src
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
          DASHBOARD_VERIFY_ATTESTATION: ${{ needs.check-lock.outputs.attestation != '' && 'require' || 'auto' }}
        run: |
          set -euo pipefail
          launcher=plugins/dashboard/scripts/dashboard_launcher.py
          python3 "$launcher" prewarm
          doctor_status=0
          if python3 "$launcher" doctor > doctor.json; then
            :
          else
            doctor_status=$?
          fi
          python3 -m json.tool doctor.json
          if [ "$doctor_status" -ne 0 ]; then
            echo "Dashboard doctor failed (exit=$doctor_status)" >&2
            exit "$doctor_status"
          fi
          for contract in examples/smart-kettle/smart-kettle.dash.json examples/bench-meter/bench-meter.dash.json; do
            design=$(basename "$contract" .dash.json)
            out="examples/$design/out"
            mkdir -p "$out"
            python3 "$launcher" generate "$contract"
            set +e
            python3 "$launcher" gates "$contract" > "$out/$design.stdout.json"
            status=$?
            set -e
            report="$out/$design.dash-report.json"
            stdout="$out/$design.stdout.json"
            if python3 - "$report" "$stdout" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report_path, stdout_path = map(Path, sys.argv[1:])
          if report_path.is_file():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              lines = [
                  f"{check['id']:26} {check['status']:16} {check['detail'][:180]}"
                  for check in report["checks"]
              ]
              print("\n".join(lines))
              verdict = report["verdict"]
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path and lines:
                  design = report_path.name.removesuffix(".dash-report.json")
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write(
                          f"### {design} gates — verdict: {verdict}\n\n```\n"
                          + "\n".join(lines)
                          + "\n```\n"
                      )
          elif stdout_path.is_file():
              output = stdout_path.read_text(encoding="utf-8")
              print(output, end="")
              verdict = json.loads(output)["verdict"]
          else:
              print(f"missing diagnostics: {report_path} and {stdout_path}", file=sys.stderr)
              sys.exit(1)
          sys.exit(0 if verdict == "pass" else 1)
          PY
            then
              diagnostics_status=0
            else
              diagnostics_status=$?
            fi
            if [ "$status" -ne 0 ] || [ "$diagnostics_status" -ne 0 ]; then
              echo "$design gates failed (exit=$status, diagnostics=$diagnostics_status)" >&2
              exit 1
            fi
          done
      - name: Upload reports
        if: always() && hashFiles('doctor.json', 'examples/*/out/*.dash-report.json', 'examples/*/out/*.stdout.json', 'examples/*/out/*.servo-smoke.log', 'examples/*/out/*.screens/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-locked-image-reports
          path: |
            examples/*/out/*.dash-report.json
            examples/*/out/*.stdout.json
            examples/*/out/*.servo-smoke.log
            examples/*/out/*.screens/**
            doctor.json
          retention-days: 30
          if-no-files-found: warn
